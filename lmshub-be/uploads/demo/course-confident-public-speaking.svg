<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Confident Public Speaking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.07">
    <circle cx="1120" cy="120" r="240"/>
    <circle cx="140" cy="660" r="150"/>
  </g>
  <rect y="300" width="1280" height="420" fill="url(#scrim)"/>
  <text x="80" y="520" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="#a7f3d0">PERSONAL DEVELOPMENT</text>
  <text font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="700" fill="#ffffff"><tspan x="80" y="612">Confident Public Speaking</tspan></text>
</svg>
