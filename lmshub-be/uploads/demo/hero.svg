<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="A lesson playing inside the course player">
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#h)"/>
  <g fill="#ffffff" opacity="0.10">
    <circle cx="660" cy="150" r="200"/>
    <circle cx="130" cy="690" r="160"/>
  </g>

