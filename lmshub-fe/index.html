<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Roboto (Latin) + Noto Sans Arabic/Devanagari agar teks ar & hi tidak jatuh ke font sistem. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+Arabic:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>LMS Hub</title>

    <!-- Konfigurasi runtime. Dimuat sebelum aplikasi supaya alamat API bisa
         diubah dengan menyunting satu berkas di server — tanpa build ulang.
         Sebelumnya alamat itu dipanggang ke dalam bundle saat build, sehingga
         memindahkan backend ke domain lain menuntut pembeli memasang Node dan
         menjalankan `npm run build`. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
